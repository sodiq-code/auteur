# Auteur — continuous integration
#
# Runs on every push to main and on every pull request. Keeps the
# backend importable and the frontend linting clean, so a broken
# commit never lands on main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python · import smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Import smoke test
        # Import the FastAPI app from the repo root so relative imports
        # (`from .api import ...`) resolve. The app gracefully falls back
        # to in-memory storage when GCP creds are absent, so no secrets
        # are needed in CI.
        run: |
          python -c "from backend.main import app; assert app.title, 'no title'; print('app.title:', app.title)"

  frontend:
    name: Frontend (Next.js · lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install
      - name: Lint
        run: bun run lint
